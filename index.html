<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosmer Tagalog Class – Verb Emoji Trainer</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        box-sizing: border-box;
        background: #fef3e2;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 18px;
      }

      .text-xs {
        font-size: 16px;
      }

      .text-sm {
        font-size: 18px;
      }

      #helper-text-1,
      #helper-text-2,
      #helper-text-3,
      #footer-text,
      #example-sentence-text {
        font-size: 18px;
      }

      @keyframes gentle-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .emoji-bounce {
        animation: gentle-bounce 0.8s ease-in-out infinite;
      }

      .focus-outline {
        outline: 2px solid #f97316;
        outline-offset: 2px;
      }
    </style>
  </head>

          <h1

            class="mt-1 opacity-90 text-[#2d2a26]"

            Guess the action, see the Tagalog verb, then use it in a sentence.
          </p>
        </div>

        <div

        </div>
      </header>

            </div>

              </p>
              <p

              </p>
            </div>
