  let currentIndex = 0;
  let answerShown = false;

  // DOM elements
  const emojiDisplay = document.getElementById("emoji-display");
  const englishVerbText = document.getElementById("english-verb-text");
  const verbIndexEl = document.getElementById("verb-index");
  const verbTotalEl = document.getElementById("verb-total");
  const showAnswerBtn = document.getElementById("show-answer-btn");
  const tagalogRootChip = document.getElementById("tagalog-root");
  const tagalogPastChip = document.getElementById("tagalog-past");
  const tagalogProgChip = document.getElementById("tagalog-prog");
  const tagalogMainVerbEl = document.getElementById("tagalog-main-verb");
  const btnPresent = document.getElementById("btn-present");
  const btnPast = document.getElementById("btn-past");
  const btnProg = document.getElementById("btn-prog");
  const exampleSentenceTextEl = document.getElementById("example-sentence-text");
  const nextVerbBtn = document.getElementById("next-verb-btn");
  const prevVerbBtn = document.getElementById("prev-verb-btn");
  const exitBtn = document.getElementById("exit-btn");
  const step2Section = document.getElementById("step2-section");
  const step3Section = document.getElementById("step3-section");
  const sentencePanel = document.getElementById("sentence-panel");

  function resetButtons() {
    [btnPresent, btnPast, btnProg].forEach((btn) => {
      btn.disabled = true;
      btn.classList.add("opacity-50", "cursor-not-allowed");
    });
  }

  function enableButtons() {
    [btnPresent, btnPast, btnProg].forEach((btn) => {
      btn.disabled = false;
      btn.classList.remove("opacity-50", "cursor-not-allowed");
    });
  }

  function loadVerb(index) {
    const v = verbs[index];
    if (!v) return;

    answerShown = false;

    emojiDisplay.textContent = v.emoji;
    englishVerbText.textContent = v.english;
    verbIndexEl.textContent = index + 1;
    verbTotalEl.textContent = verbs.length.toString();

    tagalogRootChip.textContent = v.root;
    tagalogPastChip.textContent = v.past;
    tagalogProgChip.textContent = v.prog;
    tagalogMainVerbEl.textContent = "";
    tagalogMainVerbEl.setAttribute("aria-label", "");

    exampleSentenceTextEl.textContent =
      "Click a form above to see a sample Tagalog sentence.";

    // Hide sections and chips until the answer is shown
    step2Section.classList.add("hidden");
    step3Section.classList.add("hidden");
    tagalogRootChip.classList.add("hidden");
    tagalogPastChip.classList.add("hidden");
    tagalogProgChip.classList.add("hidden");

    // Disable form buttons
    resetButtons();

    showAnswerBtn.textContent = "Ipakita ang pandiwa";
  }

  function showSentenceForForm(form) {
    const v = verbs[currentIndex];
    if (!v) return;

    if (form === "basic") exampleSentenceTextEl.textContent = v.exampleRoot;
    if (form === "past") exampleSentenceTextEl.textContent = v.examplePast;
    if (form === "ongoing") exampleSentenceTextEl.textContent = v.exampleProg;
  }

  showAnswerBtn.addEventListener("click", () => {
    const v = verbs[currentIndex];
    if (!v) return;
    answerShown = true;

    // Show the basic Tagalog verb in big letters
    tagalogMainVerbEl.textContent = v.root.toUpperCase();
    tagalogMainVerbEl.setAttribute(
      "aria-label",
      "Tagalog verb " + v.root
    );

    // Change button label after showing the verb
    showAnswerBtn.textContent = "Nakita na ang pandiwa";

    // Reveal Step 2 + Step 3 and the small chips
    step2Section.classList.remove("hidden");
    step3Section.classList.remove("hidden");
    tagalogRootChip.classList.remove("hidden");
    tagalogPastChip.classList.remove("hidden");
    tagalogProgChip.classList.remove("hidden");

    // Enable the Basic / Past / Ongoing buttons
    enableButtons();

    // Immediately show the BASIC example sentence
    showSentenceForForm("basic");

    // Smooth scroll to the Example Sentence panel (helps on phones)
    if (sentencePanel) {
      setTimeout(() => {
        sentencePanel.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 50);
    }
  });

  btnPresent.addEventListener("click", () => {
    if (!answerShown) return;
    const v = verbs[currentIndex];
    if (!v) return;
    tagalogMainVerbEl.textContent = v.root.toUpperCase();
    showSentenceForForm("basic");
  });

  btnPast.addEventListener("click", () => {
    if (!answerShown) return;
    const v = verbs[currentIndex];
    if (!v) return;
    tagalogMainVerbEl.textContent = v.past.toUpperCase();
    showSentenceForForm("past");
  });

  btnProg.addEventListener("click", () => {
    if (!answerShown) return;
    const v = verbs[currentIndex];
    if (!v) return;
    tagalogMainVerbEl.textContent = v.prog.toUpperCase();
    showSentenceForForm("ongoing");
  });

  nextVerbBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % verbs.length;
    loadVerb(currentIndex);
  });

  prevVerbBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + verbs.length) % verbs.length;
    loadVerb(currentIndex);
  });

  exitBtn.addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      alert("You can now close this tab or window.");
    }
  });

  // Focus outline helper
  [
    showAnswerBtn,
    btnPresent,
    btnPast,
    btnProg,
    nextVerbBtn,
    prevVerbBtn,
    exitBtn,
  ].forEach((btn) => {
    btn.addEventListener("focus", () => btn.classList.add("focus-outline"));
    btn.addEventListener("blur", () => btn.classList.remove("focus-outline"));
  });

  // Init
  loadVerb(currentIndex);
</script>
